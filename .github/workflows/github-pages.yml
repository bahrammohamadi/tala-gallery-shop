name: Publish GitHub Pages preview

on:
  push:
    branches:
      - "arena/61252afb-tala-gallery-shop"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the active branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Build a static concept preview
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_STATIC_PREVIEW: "true"
          NEXT_PUBLIC_SITE_URL: https://bahrammohamadi.github.io/tala-gallery-shop
        run: |
          # GitHub Pages serves static files only; the application APIs and auth-refresh middleware
          # stay in the repository but are excluded from this preview artifact.
          rm -rf app/api
          rm -f middleware.ts
          npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy the static preview
        id: deployment
        uses: actions/deploy-pages@v4
